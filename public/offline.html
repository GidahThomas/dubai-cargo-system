<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#085041">
    <title>You're offline | Dubai Tech Plaza</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #ffffff;
            color: #102a27;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }
        .card {
            max-width: 360px;
            padding: 32px 24px;
            border: 1px solid #ebe3d3;
            border-radius: 20px;
            background: #fbf8f2;
        }
        img { width: 72px; height: 72px; border-radius: 50%; }
        h1 { margin: 16px 0 8px; font-size: 1.35rem; }
        p { margin: 0 0 20px; color: #5b6b69; line-height: 1.55; }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 12px;
            background: #085041;
            color: #fff;
            font: inherit;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="assets/icons/icon-192.png" alt="Dubai Tech Plaza">
        <h1>You're offline</h1>
        <p>Check your internet or Wi-Fi connection. Your cart and orders are safe and will be here when you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
